[package]
name = "gws-store"
version = "0.1.0"
description = "The Google Workspace plugin's encrypted local store: SQLCipher, keyed from the provisioned plugin key, migrations"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
