[package]
name = "buwiz-gws"
version = "1.1.0"
edition = "2021"
description = "The first-party Google Workspace plugin (app.buwiz.google-workspace): read-only Gmail tools over the user's workspace-mcp, as a stdio MCP server"
repository = "https://github.com/buwiz-app/google-workspace"
publish = false

[dependencies]
# the provisioned key and the manifest digest (src/v1)
base64 = "0.22"
ed25519-dalek = "2.2"
# workspace-mcp's text answers are parsed with JS regex semantics (lookbehind
# for `^` in multiline mode), as server.mjs parsed them
fancy-regex = "0.16"
# the stdio MCP client's child process group (src/mcp.rs)
libc = "0.2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "signal", "sync", "time"] }
