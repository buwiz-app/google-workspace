[workspace]
resolver = "2"
members = ["crates/gws-plugin", "crates/gws-store", "crates/gws-fake-google", "crates/gws-screens"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/buwiz-app/google-workspace"

[workspace.dependencies]
# The SDK, pinned by commit, each crate once here and inherited by the members
# (`workspace = true`); tools/sdk-pin.sh reads it.
buwiz-plugin = { git = "https://github.com/buwiz-app/buwiz-sdk", rev = "f63038d5cdbb05a20d9f329be3a85a8a6f3e8f8d" }
buwiz-app = { git = "https://github.com/buwiz-app/buwiz-sdk", rev = "f63038d5cdbb05a20d9f329be3a85a8a6f3e8f8d" }
# plain: gws-screens is compiled into the Bot, and a feature here would change
# serde_json for the whole app. The plugin turns on preserve_order for itself.
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
