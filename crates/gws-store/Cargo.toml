[package]
name = "gws-store"
version = "0.1.0"
description = "The Google Workspace plugin's encrypted local store: SQLCipher, keyed from the provisioned plugin key, migrations"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sha2 = "0.10"

# SQLCipher's crypto: Apple's CommonCrypto on macOS, so no OpenSSL there. Other
# platforms have no system crypto SQLCipher can count on, so OpenSSL is built in.
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
