[workspace]
resolver = "2"
members = ["crates/gws-plugin", "crates/gws-store", "crates/gws-fake-google", "crates/gws-screens"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/buwiz-app/google-workspace"

[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
codegen-units = 1
lto = "thin"
