[package]
name = "gws-screens"
version = "0.1.0"
description = "The Google Workspace plugin's native screens: Mail, Calendar and Drive, compiled into Buwiz Bot"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# the Bot pins these two: move them together, or `ScreenDef` is two types
buwiz-app = { git = "https://github.com/buwiz-app/buwiz-sdk", rev = "79883a820597c623c9259cc0fac0c4166bdde093" }
nsh-core = { git = "https://github.com/hexuria/nsh", rev = "f1461478d3768fb5da872cb697f0b0a48564ee91" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# a time typed for another zone means that zone
chrono-tz = { version = "0.10", default-features = false }
serde_json.workspace = true
url = "2"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
# the same nsh as above: the Mail screen driven with no window
nsh-engine = { git = "https://github.com/hexuria/nsh", rev = "f1461478d3768fb5da872cb697f0b0a48564ee91" }
nsh-testing = { git = "https://github.com/hexuria/nsh", rev = "f1461478d3768fb5da872cb697f0b0a48564ee91" }
# the Calendar's date maths, run in real zones: never a dependency of the screens
