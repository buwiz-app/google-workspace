[package]
name = "gws-screens"
version = "0.1.0"
description = "The Google Workspace plugin's native screens: Mail, Calendar and Drive, compiled into Buwiz Bot"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# the Bot pins these two (buwiz-app's rev is in the root Cargo.toml): move them
# together, or `ScreenDef` is two types
buwiz-app.workspace = true
nsh-core = { git = "https://github.com/hexuria/nsh", rev = "3fcb4e58b2aeb8750d78803e356408c4b36c0f55" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# a time typed for another zone means that zone
chrono-tz = { version = "0.10", default-features = false }
serde_json.workspace = true
url = "2"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
# the same nsh as above: the Mail screen driven with no window
nsh-engine = { git = "https://github.com/hexuria/nsh", rev = "3fcb4e58b2aeb8750d78803e356408c4b36c0f55" }
# `agent`: the semantic tree, as the Bot's filter reads it
nsh-testing = { git = "https://github.com/hexuria/nsh", rev = "3fcb4e58b2aeb8750d78803e356408c4b36c0f55", features = ["agent"] }
# the Drive screen on the real plugin and the stub, so the two can't drift
buwiz-gws = { path = "../gws-plugin" }
gws-fake-google = { path = "../gws-fake-google" }
gws-store = { path = "../gws-store" }
# the Calendar's date maths, run in real zones: never a dependency of the screens
